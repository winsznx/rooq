[package]
name = "rooq-risk-kernel"
version = "0.1.0"
edition = "2021"
description = "Deterministic integer reference model of Rooq's perp and spot settlement math. Not authoritative onchain."
license = "BUSL-1.1"
publish = false

[dependencies]
ethnum = "=1.5.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[[bin]]
name = "gen-vectors"
path = "src/bin/gen_vectors.rs"
