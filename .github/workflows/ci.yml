name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Generate Next.js route types
        run: |
          pnpm --filter @rooq/web exec next typegen
          pnpm --filter @rooq/docs exec next typegen
      - name: Typecheck
        run: pnpm -r --filter=./packages/* --filter=./apps/* exec tsc --noEmit
      - name: SDK unit tests
        run: pnpm --filter @rooq/sdk test
